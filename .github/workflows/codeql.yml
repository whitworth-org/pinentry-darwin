# SPDX-License-Identifier: MIT
# CodeQL: Swift static analysis for security-and-quality findings.
#
# Security model:
#   - No build secrets are referenced; CodeQL traces a debug build only.
#   - Workflow-level permissions deny everything by default; the analyze job
#     opts in only to read scopes (contents:read, actions:read).
#   - SARIF upload to GitHub code-scanning is disabled because this repo is
#     private on Free and lacks GitHub Advanced Security. The analysis still
#     runs (catches build issues, validates the toolchain, exercises the
#     queries), and SARIF is retained as a workflow artifact for offline
#     review. To enable code-scanning upload, either make the repo public
#     (free) or purchase GHAS, then flip `upload: "never"` to `"always"` and
#     re-add `security-events: write` to the job permissions block below.
#   - Runner is hardened via step-security/harden-runner (audit mode).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 08:00 UTC
    - cron: '0 8 * * 1'

permissions: {}

jobs:
  analyze:
    name: analyze-swift
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@65216971a11ded447a6b76263d5a144519e5eee1 # codeql-bundle-v2.25.2
        with:
          languages: swift
          queries: security-and-quality

      - name: Build (debug, for CodeQL tracing)
        run: |
          set -euo pipefail
          swift build -c debug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@65216971a11ded447a6b76263d5a144519e5eee1 # codeql-bundle-v2.25.2
        with:
          category: "/language:swift"
          upload: "never"
          output: codeql-results

      - name: Upload SARIF as workflow artifact
        # CodeQL findings are retained here for offline review since we
        # cannot push them to the Security tab without GHAS.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-swift
          path: codeql-results/
          retention-days: 30
          if-no-files-found: warn
