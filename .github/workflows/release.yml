# SPDX-License-Identifier: MIT
# Release: tag-driven signed + notarized build of pinentry-darwin.
#
# Security model:
#   - Triggered exclusively by signed annotated tags matching v*.*.* — no
#     workflow_dispatch, no branch trigger, no fork can run it.
#   - Workflow-level permissions deny everything by default; only the release
#     job opts in to contents:write to publish a draft GitHub Release.
#   - Runs in the `production` environment, which gates required reviewers and
#     scopes the signing/notarization secrets to this workflow.
#   - Each step receives only the secrets it needs via step-level env: blocks.
#     No `${{ secrets.X }}` interpolation appears inside any run: script.
#   - Cert decoding uses `printenv` (not `echo`) so the base64 blob never
#     appears on a process command line.
#   - An ephemeral keychain is created in $RUNNER_TEMP, used for the run, and
#     deleted in the always-cleanup step; .p12s and the notary .p8 are
#     securely removed with `rm -P`.
#   - The release job verifies the tag's GPG signature against the maintainer's
#     public key before any signing or notarization runs.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build-sign-notarize-publish
    runs-on: macos-26
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write  # gh release create publishes the draft release + assets
    env:
      TEAM_ID: KHJA84J3YW
      BUNDLE_ID: org.whitworth.pinentry-darwin
    steps:
      - name: Harden runner
        # Allowlist scope: GitHub (checkout, action downloads, asset uploads,
        # actions runtime), Apple (notarytool submission, codesign timestamp
        # + OCSP/CRL during sign), StepSecurity telemetry. Wildcards:
        # *.apple.com covers notarize/notary-submissions/appstoreconnect/
        # developer/timestamp/ocsp/crl; *.blob.core.windows.net covers
        # GitHub's randomly-assigned action result storage; *.actions
        # .githubusercontent.com covers results-receiver and any other
        # actions-runtime endpoints.
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.apple.com:443
            *.blob.core.windows.net:443
            agent.api.stepsecurity.io:443
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            prod.app-api.stepsecurity.io:443
            raw.githubusercontent.com:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Import maintainer public key (for tag verification)
        run: |
          set -euo pipefail
          # Public key is committed at .github/maintainer-pubkey.asc — not a
          # secret, but keeping it in-tree means tag verification has no
          # external network dependency and an attacker swapping the key is
          # caught by the commit-signing requirement on main.
          gpg --batch --import .github/maintainer-pubkey.asc
          # Mark the maintainer key ultimately trusted for this ephemeral
          # runner only, so `git tag -v` reports "Good signature" rather
          # than "untrusted". Full fingerprint, not short ID.
          gpg --batch --import-ownertrust <<'EOF'
          1EA93FE7B6638F3C6B6E9C5C2ABD2764D9D7175C:6:
          EOF
          # Force trustdb recomputation and on-disk commit so the next
          # gpg invocation does not race against an in-flight trust
          # recalculation. Observed on macos-15 runners during the
          # v1.1.0 release: ownertrust import returned before trustdb
          # was settled, the following `git tag -v` exited non-zero
          # under pipefail even though the signature was good and trust
          # was ultimate, causing a spurious "not signed by trusted
          # key" failure that cleared on rerun.
          gpg --batch --check-trustdb

      - name: Verify tag signature
        env:
          MAINTAINER_FPR: 1EA93FE7B6638F3C6B6E9C5C2ABD2764D9D7175C
        run: |
          set -euo pipefail
          # Use machine-readable GPG status lines. `git tag -v` prints the
          # tag object's message before its human-readable GPG output, so a
          # malicious tag message can spoof strings like "Good signature".
          verify_output="$(git verify-tag --raw "$GITHUB_REF_NAME" 2>&1)" || {
            echo "::error::Tag $GITHUB_REF_NAME is not signed by a trusted key" >&2
            awk '{print "  " $0}' <<<"$verify_output" >&2
            exit 1
          }
          if ! grep -qE "^\\[GNUPG:\\] VALIDSIG ${MAINTAINER_FPR}( |$)" <<<"$verify_output"; then
            echo "::error::Tag $GITHUB_REF_NAME is not signed by maintainer $MAINTAINER_FPR" >&2
            awk '{print "  " $0}' <<<"$verify_output" >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME verified against $MAINTAINER_FPR"

      - name: Verify Info.plist version matches tag
        run: |
          set -euo pipefail
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PLIST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Info.plist CFBundleShortVersionString=$PLIST_VERSION does not match tag $TAG_VERSION" >&2
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Provision ephemeral keychain and import signing certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.INSTALLER_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/runner.keychain-db"
          BUILD_CERT_PATH="$RUNNER_TEMP/build_cert.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer_cert.p12"
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "BUILD_CERT_PATH=$BUILD_CERT_PATH"
            echo "INSTALLER_CERT_PATH=$INSTALLER_CERT_PATH"
          } >> "$GITHUB_ENV"

          # Decode certs from base64. Use printenv (no echoing on cmdline).
          printenv BUILD_CERTIFICATE_BASE64 | base64 -d > "$BUILD_CERT_PATH"
          printenv INSTALLER_CERTIFICATE_BASE64 | base64 -d > "$INSTALLER_CERT_PATH"

          # Create + unlock + add-to-search-list
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Prepend (not replace) to user search list. Read existing
          # keychains into an array so paths with spaces (none today,
          # but defensive) are preserved instead of word-split.
          existing_keychains=()
          while IFS= read -r kc; do
            kc="${kc#\"}"
            kc="${kc%\"}"
            kc="${kc#"${kc%%[![:space:]]*}"}"
            [ -n "$kc" ] && existing_keychains+=("$kc")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${existing_keychains[@]}"
          security default-keychain -s "$KEYCHAIN_PATH"

          # Import — note -T whitelists tools allowed to use the key without prompt
          security import "$BUILD_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$BUILD_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$INSTALLER_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productsign -T /usr/bin/security

          # macOS 10.12+ ACL — allow non-interactive signing
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Securely delete decoded p12s
          rm -P "$BUILD_CERT_PATH" "$INSTALLER_CERT_PATH"

      - name: Provision notarytool credentials
        env:
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "AUTH_KEY_PATH=$AUTH_KEY_PATH" >> "$GITHUB_ENV"
          printenv NOTARY_API_KEY_BASE64 | base64 -d > "$AUTH_KEY_PATH"
          xcrun notarytool store-credentials pinentry-darwin-notary \
            --key "$AUTH_KEY_PATH" \
            --key-id "$NOTARY_API_KEY_ID" \
            --issuer "$NOTARY_API_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"

      - name: Verify signing identity is visible
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning | grep -F "(${TEAM_ID})" || (echo "::error::Signing identity for team ${TEAM_ID} not found"; exit 1)

      - name: Build, sign, notarize, package, tarball
        env:
          INSTALLER_SIGNER_NAME: ${{ secrets.INSTALLER_SIGNER_NAME }}
        run: |
          set -euo pipefail
          make release SIGNER_NAME="$INSTALLER_SIGNER_NAME" VERSION="$VERSION" NOTARY_PROFILE=pinentry-darwin-notary

      - name: Verify notarized artifacts
        run: |
          set -euo pipefail
          PKG="build/pinentry-darwin-${VERSION}.pkg"
          TGZ="build/pinentry-darwin-${VERSION}-arm64.tar.gz"
          [ -f "$PKG" ] || { echo "::error::Missing $PKG"; exit 1; }
          [ -f "$TGZ" ] || { echo "::error::Missing $TGZ"; exit 1; }
          spctl -a -vv -t exec build/pinentry-darwin.app
          spctl -a -vv -t install "$PKG"
          xcrun stapler validate build/pinentry-darwin.app
          xcrun stapler validate "$PKG"
          codesign -dvv build/pinentry-darwin.app 2>&1 | grep -F "TeamIdentifier=${TEAM_ID}"
          codesign -dvv build/pinentry-darwin.app 2>&1 | grep -F 'flags=0x10000(runtime)'

      - name: Compute SHA-256 sums and write step summary
        run: |
          set -euo pipefail
          PKG_NAME="pinentry-darwin-${VERSION}.pkg"
          TGZ_NAME="pinentry-darwin-${VERSION}-arm64.tar.gz"
          # Emit standard `<hash>  <filename>` so downloaders can run
          # `shasum -a 256 --ignore-missing -c sha256sums.txt` directly.
          (cd build && shasum -a 256 "$PKG_NAME" "$TGZ_NAME") > sha256sums.txt
          PKG_SUM="$(awk -v f="$PKG_NAME" '$2 == f {print $1}' sha256sums.txt)"
          TGZ_SUM="$(awk -v f="$TGZ_NAME" '$2 == f {print $1}' sha256sums.txt)"
          {
            echo "## pinentry-darwin ${VERSION}"
            echo
            echo "| Artifact | SHA-256 |"
            echo "|---|---|"
            echo "| \`${PKG_NAME}\` | \`${PKG_SUM}\` |"
            echo "| \`${TGZ_NAME}\` | \`${TGZ_SUM}\` |"
          } > "$GITHUB_STEP_SUMMARY"

      - name: Publish draft GitHub Release
        # Native `gh release create` is preinstalled on the runner and
        # eliminates one third-party-action supply-chain dependency. fails
        # naturally if any of the listed asset files do not exist.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "build/pinentry-darwin-${VERSION}.pkg" \
            "build/pinentry-darwin-${VERSION}-arm64.tar.gz" \
            sha256sums.txt

      - name: Cleanup ephemeral keychain and notary key
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -uo pipefail
          for secret_path in "${BUILD_CERT_PATH:-}" "${INSTALLER_CERT_PATH:-}" "${AUTH_KEY_PATH:-}"; do
            if [ -n "$secret_path" ] && [ -f "$secret_path" ]; then
              rm -P "$secret_path" || true
            fi
          done
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
