# SPDX-License-Identifier: MIT
# CI: build, test, and audit pinentry-darwin on every PR / push to main,
# plus lint the workflow files themselves with zizmor.
# The Assuan smoke test is part of `swift test` (Tests/IntegrationSmokeTests/).
#
# Security model:
#   - No secrets are referenced anywhere in this workflow; PR runs from forks
#     would have read-only secrets anyway, but we make the absence explicit.
#   - Workflow-level permissions deny everything by default; each job opts in
#     only to the minimum scopes it needs.
#   - Runner is hardened via step-security/harden-runner. The build and zizmor
#     jobs declare different egress allowlists for what each one needs.
#   - Checkout uses persist-credentials: false so the GITHUB_TOKEN is not left
#     on disk for subsequent steps.
name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-test-audit
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read  # checkout
      actions: read  # cache telemetry + harden-runner egress baseline
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            agent.api.stepsecurity.io:443
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            prod.app-api.stepsecurity.io:443
            raw.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify Swift toolchain >= 6.0
        run: |
          set -euo pipefail
          SWIFT_LINE=$(swift --version | head -1)
          echo "Detected: $SWIFT_LINE"
          # Extract first dotted version number from the banner.
          SWIFT_VER=$(printf '%s\n' "$SWIFT_LINE" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          if [ -z "$SWIFT_VER" ]; then
            echo "::error::Could not parse Swift version from: $SWIFT_LINE" >&2
            exit 1
          fi
          MAJOR=${SWIFT_VER%%.*}
          if [ "$MAJOR" -lt 6 ]; then
            echo "::error::Swift $SWIFT_VER is too old; need >= 6.0" >&2
            exit 1
          fi

      - name: Cache .build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .build
          key: ${{ runner.os }}-swiftbuild-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-swiftbuild-${{ hashFiles('Package.swift') }}
            ${{ runner.os }}-swiftbuild-

      - name: Swift test
        run: |
          set -euo pipefail
          swift test --parallel

      - name: Swift build (release)
        run: |
          set -euo pipefail
          swift build -c release

      - name: Make build (bundle .app)
        run: |
          set -euo pipefail
          make build

      - name: Make audit (static bundle checks)
        # The audit-bundle Swift tool accepts an ad-hoc-signed binary in
        # CI; full Developer ID signing only runs in release.yml.
        run: |
          set -euo pipefail
          make audit

  zizmor:
    name: zizmor-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run zizmor
        # advanced-security: false because this is a private repo on Free,
        # where code-scanning SARIF upload requires GHAS. Findings surface
        # as PR annotations instead. (Re-enable if the repo goes public or
        # buys GHAS.) zizmor is a hard gate: non-zero exit fails the job.
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
        with:
          advanced-security: false
          annotations: true
