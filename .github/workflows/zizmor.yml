# SPDX-License-Identifier: MIT
# zizmor: lint GitHub Actions workflows for security smells.
#
# Security model:
#   - Workflow-level permissions deny everything by default; the lint job
#     opts in only to contents: read.
#   - Runner is hardened via step-security/harden-runner (audit mode on
#     ubuntu-latest; egress profile differs from the macOS jobs).
#   - Checkout uses persist-credentials: false; zizmor never needs the token.
#   - All actions are SHA-pinned with trailing # vX.Y.Z comments.
#
# Reporting:
#   - advanced-security: false because this is a private repo on Free, where
#     code-scanning SARIF upload requires GHAS. Findings surface as PR
#     annotations instead. (Re-enable advanced-security if the repo goes
#     public or buys GHAS.)
#   - zizmor is a hard gate: a non-zero exit fails the workflow.
name: zizmor

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
        with:
          advanced-security: false
          annotations: true
